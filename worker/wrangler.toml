name = "ascii-art-reveal-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# 公開元オリジンを制限する。GitHub Pages のURLに合わせて設定する。
# 例: "https://<ユーザー名>.github.io"
# 開発時にローカルのフロントから叩く場合はカンマ区切りで追加する。
# 例: "https://<ユーザー名>.github.io,http://localhost:5173"
# すべて許可する場合は "*"（本番では非推奨）。
[vars]
ALLOWED_ORIGIN = "*"
GEMINI_MODEL = "gemini-1.5-flash"

# GEMINI_API_KEY は [vars] へは書かない。必ず Secret として登録する:
#   wrangler secret put GEMINI_API_KEY
